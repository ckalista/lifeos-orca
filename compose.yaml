services:
  orca:
    build:
      context: .
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      ORCA_PORT: "6768"
      TZ: Europe/London
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
    command:
      - serve
      - --port
      - "6768"
      - --pairing-address
      - 100.83.19.5
    ports:
      - "100.83.19.5:6768:6768"
    volumes:
      - orca-home:/home/orca
      - orca-workspace:/workspace
    healthcheck:
      test:
        - CMD-SHELL
        - timeout 2 bash -c '</dev/tcp/127.0.0.1/$${ORCA_PORT}'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  orca-home:
  orca-workspace:
